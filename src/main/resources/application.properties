# ===================================================================
spring.application.name=rally-notification
server.port=${SERVER_PORT:8010}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.config.import=optional:file:.env[.properties]

# ===================================================================
# Apache Kafka
# ===================================================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Producer Configurations
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true

# Consumer Configurations
spring.kafka.consumer.group-id=notification-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.rally.notification.messaging.event
spring.kafka.consumer.properties.spring.json.value.default.type=com.fasterxml.jackson.databind.JsonNode
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# Kafka observation: creates OTel spans for consumer/producer and auto-propagates
# the W3C traceparent header, so spans link across services without manual headers.
spring.kafka.listener.observation-enabled=true
spring.kafka.template.observation-enabled=true

# ===================================================================
# Mail (Mailpit local SMTP catcher - UI at http://localhost:8025)
# ===================================================================
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1080}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:false}
notification.mail.from=${MAIL_FROM:no-reply@rally.local}

# OTP decryption (must match rally-auth's app.otp.encryption.*)
app.otp.encryption.password=${OTP_ENCRYPTION_PASSWORD:Rally@OtpKey2026!Sec}
app.otp.encryption.salt=${OTP_ENCRYPTION_SALT:41b0bf0fbeeb24a5022dc25ead1b5009}

# ===================================================================
# Logging
# Default levels are tuned to reduce noise. Business code (com.rally.notification)
# stays at INFO; framework/Hibernate/Kafka/Spring are raised to reduce clutter.
# ===================================================================
logging.level.root=${LOGGING_LEVEL_ROOT:INFO}

# Application business logs (keep DEBUG only if you truly need fine-grained output)
logging.level.com.rally.notification=${LOGGING_LEVEL_RALLY:INFO}

# Kafka: quiet the consumer/client internals (rebalancing, polls, heartbeats)
logging.level.org.apache.kafka=${LOGGING_LEVEL_KAFKA:WARN}
logging.level.org.apache.kafka.clients.consumer=${LOGGING_LEVEL_KAFKA_CONSUMER:OFF}
logging.level.org.apache.kafka.clients.producer=${LOGGING_LEVEL_KAFKA_PRODUCER:OFF}
logging.level.org.apache.kafka.clients.NetworkClient=OFF
logging.level.kafka=OFF

# Spring Kafka listener container (consumer group/assignment churn)
logging.level.org.springframework.kafka=${LOGGING_LEVEL_SPRING_KAFKA:WARN}
logging.level.org.springframework.kafka.listener=${LOGGING_LEVEL_SPRING_KAFKA_LISTENER:WARN}

# Spring Boot startup / framework noise
logging.level.org.springframework=${LOGGING_LEVEL_SPRING:WARN}
logging.level.org.springframework.boot=${LOGGING_LEVEL_SPRING_BOOT:WARN}

# Mail / JavaMail internals
logging.level.org.springframework.mail=WARN

# ===================================================================
# Actuator & Observability & Tracing
# ===================================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS:always}
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
management.opentelemetry.tracing.export.otlp.transport=http

# W3C baggage: carry X-Correlation-Id across services and surface them in logs
# (MDC) and spans, so they are searchable in Jaeger by tag.
management.tracing.baggage.remote-fields=X-Correlation-Id
management.tracing.baggage.correlation.fields=X-Correlation-Id
management.tracing.baggage.tag-fields=X-Correlation-Id