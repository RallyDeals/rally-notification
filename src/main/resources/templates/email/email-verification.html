<!DOCTYPE html>
<!--/*
  Model attributes expected by this template:
    otp : String - the decrypted one-time verification code
*/-->
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Verify your email</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f7;font-family:Arial,Helvetica,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f7;padding:24px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:8px;overflow:hidden;">
                <tr>
                    <td style="background-color:#1a73e8;padding:24px;text-align:center;">
                        <h1 style="margin:0;color:#ffffff;font-size:20px;">Verify Your Email</h1>
                    </td>
                </tr>
                <tr>
                    <td style="padding:24px;color:#333333;">
                        <p style="font-size:16px;margin-top:0;">
                            Use the verification code below to verify your email address:
                        </p>

                        <p style="text-align:center;margin:24px 0;">
                            <span th:text="${otp}"
                                  style="display:inline-block;font-size:28px;font-weight:bold;letter-spacing:8px;color:#1a73e8;background-color:#eef4fe;border-radius:6px;padding:12px 24px;">123456</span>
                        </p>

                        <p style="font-size:14px;color:#555555;">
                            This code expires soon. If you didn't request it, you can safely ignore this email.
                        </p>

                        <p style="font-size:14px;color:#888888;margin-top:24px;">
                            Thanks for shopping with Rally!
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
