<!DOCTYPE html>
<!--/*
  Model attributes expected by this template:
    orderId    : UUID       - the authorized order's id
    dealId     : UUID       - the deal the user joined
    totalPrice : BigDecimal - the total price of the order
*/-->
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Your join has been authorized</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f7;font-family:Arial,Helvetica,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f7;padding:24px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:8px;overflow:hidden;">
                <tr>
                    <td style="background-color:#188038;padding:24px;text-align:center;">
                        <h1 style="margin:0;color:#ffffff;font-size:20px;">Join Authorized</h1>
                    </td>
                </tr>
                <tr>
                    <td style="padding:24px;color:#333333;">
                        <p style="font-size:16px;margin-top:0;">
                            Great news! In deal <strong th:text="${dealId}">dealId</strong>, your join has been
                            <strong style="color:#188038;">authorized</strong>.
                        </p>
                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-top:16px;border-collapse:collapse;">
                            <tr style="border-top:1px solid #eeeeee;">
                                <td style="padding:12px 0;font-size:14px;color:#555555;">Order</td>
                                <td style="padding:12px 0;text-align:right;font-size:14px;color:#333333;" th:text="${orderId}">orderId</td>
                            </tr>
                            <tr style="border-top:1px solid #eeeeee;">
                                <td style="padding:12px 0;font-size:14px;color:#555555;">Total</td>
                                <td style="padding:12px 0;text-align:right;font-size:15px;font-weight:bold;color:#333333;" th:text="${'$' + #numbers.formatDecimal(totalPrice, 1, 2)}">$0.00</td>
                            </tr>
                        </table>
                        <p style="font-size:14px;color:#888888;margin-top:24px;">
                            You're all set — we'll keep you posted as the deal progresses.
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
